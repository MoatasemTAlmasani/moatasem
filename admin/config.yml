# لوحة التحكم — Sveltia CMS
backend:
  name: github
  repo: MoatasemTAlmasani/moatasem   # غيّرها: اسم حسابك/اسم المستودع
  branch: main

media_folder: assets/uploads
public_folder: /assets/uploads
site_url: https://moatasem.vercel.app
display_url: https://moatasem.vercel.app
publish_mode: simple

collections:
  - name: articles
    label: المقالات
    label_singular: مقال
    folder: content/articles
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    identifier_field: slug
    summary: "{{title}}"
    sortable_fields: [date, title]
    fields:
      - {name: title, label: العنوان, widget: string}
      - {name: slug, label: الرابط بالإنجليزية (مثل my-first-article), widget: string, pattern: ['^[a-z0-9-]+$', 'أحرف إنجليزية صغيرة وأرقام وشرطات فقط']}
      - {name: description, label: وصف قصير (يظهر في جوجل وفي البطاقة), widget: text}
      - {name: date, label: تاريخ النشر, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true}
      - {name: body, label: نص المقال, widget: markdown}

  - name: site
    label: محتوى الموقع
    files:
      - name: certs
        label: الشهادات
        file: content/certs.json
        description: "أضف شهادة جديدة أو عدّل شهادة"
        fields:
          - name: items
            label: القائمة
            widget: list
            add_to_top: true
            summary: "{{fields.title}}"
            fields:
              - {name: title, label: اسم الشهادة, widget: string}
              - {name: issuer, label: الجهة المانحة, widget: string}
              - {name: date, label: التاريخ (مثل October 2026), widget: string}
              - name: category
                label: التصنيف
                widget: select
                options:
                  - {label: شبكات وأمن, value: net}
                  - {label: أنظمة وسحابة وبيانات, value: sys}
                  - {label: دعم وإدارة, value: itsm}
                  - {label: تطوير مهني, value: pd}
              - {name: featured, label: شهادة مميزة (بإطار بارز), widget: boolean, default: false, required: false}
              - {name: more, label: تظهر فقط عند الضغط على «عرض كل الشهادات», widget: boolean, default: false, required: false}
              - name: badge
                label: شارة اختيارية (مثل اختبار معتمد)
                widget: object
                required: false
                fields:
                  - {name: ar, label: العربية, widget: string, required: false}
                  - {name: en, label: English, widget: string, required: false}
              - {name: key, label: رمز فريد بالإنجليزية (مثل ccna-200-301), widget: string}
              - {name: pdf, label: ملف الشهادة PDF, widget: file, required: false, media_folder: /assets/certs, public_folder: /assets/certs, choose_url: false}
              - {name: link, label: رابط خارجي للشهادة (Credly وغيره), widget: string, required: false}
              - {name: optional, label: بدون ملف PDF (يظهر الزر فقط إذا وُجد رابط خارجي), widget: boolean, default: false, required: false}

      - name: experience
        label: الخبرات
        file: content/experience.json
        description: ""
        fields:
          - name: items
            label: القائمة
            widget: list
            add_to_top: true
            summary: "{{fields.title.ar}}"
            fields:
              - name: tag
                label: التصنيف (خبرة مهنية)
                widget: object
                collapsed: false
                required: true
                fields:
                  - {name: ar, label: العربية, widget: string, required: true}
                  - {name: en, label: English, widget: string, required: false}
              - name: title
                label: المسمى الوظيفي
                widget: object
                collapsed: false
                required: true
                fields:
                  - {name: ar, label: العربية, widget: string, required: true}
                  - {name: en, label: English, widget: string, required: false}
              - name: org
                label: الجهة
                widget: object
                collapsed: false
                required: true
                fields:
                  - {name: ar, label: العربية, widget: string, required: true}
                  - {name: en, label: English, widget: string, required: false}
              - name: date
                label: الفترة
                widget: object
                collapsed: false
                required: true
                fields:
                  - {name: ar, label: العربية, widget: string, required: true}
                  - {name: en, label: English, widget: string, required: false}
              - name: place
                label: المكان
                widget: object
                collapsed: false
                required: true
                fields:
                  - {name: ar, label: العربية, widget: string, required: true}
                  - {name: en, label: English, widget: string, required: false}
              - name: kpis
                label: أرقام بارزة
                widget: list
                required: false
                summary: "{{fields.ar}}"
                fields:
                  - {name: ar, label: العربية, widget: string}
                  - {name: en, label: English, widget: string, required: false}
              - name: bullets
                label: المهام والإنجازات
                widget: list
                required: false
                summary: "{{fields.ar}}"
                fields:
                  - {name: ar, label: العربية, widget: string}
                  - {name: en, label: English, widget: string, required: false}

      - name: skills
        label: المهارات
        file: content/skills.json
        description: ""
        fields:
          - name: items
            label: القائمة
            widget: list
            add_to_top: true
            summary: "{{fields.title.ar}}"
            fields:
              - {name: title, label: اسم المجموعة, widget: object, fields: [{name: ar, label: العربية, widget: string}, {name: en, label: English, widget: string, required: false}]}
              - name: icon
                label: الأيقونة
                widget: select
                required: false
                options:
                  - {label: شاشة / أنظمة, value: monitor}
                  - {label: درع / أمن, value: shield}
                  - {label: شبكة, value: network}
                  - {label: أدوات, value: tools}
                  - {label: سماعة / دعم, value: headset}
                  - {label: طبقات / تصميم, value: layers}
                  - {label: اتصال WAN, value: wan}
                  - {label: قبعة تخرج, value: graduation}
              - {name: order, label: الترتيب (رقم), widget: number, value_type: int, default: 1}
              - {name: tags, label: المهارات, widget: list, field: {name: tag, label: مهارة, widget: string}}

      - name: projects
        label: المشاريع
        file: content/projects.json
        description: ""
        fields:
          - name: items
            label: القائمة
            widget: list
            add_to_top: true
            summary: "{{fields.title.ar}}"
            fields:
              - name: title
                label: عنوان المشروع
                widget: object
                collapsed: false
                required: true
                fields:
                  - {name: ar, label: العربية, widget: string, required: true}
                  - {name: en, label: English, widget: string, required: false}
              - name: tag
                label: التصنيف
                widget: object
                collapsed: false
                required: true
                fields:
                  - {name: ar, label: العربية, widget: string, required: true}
                  - {name: en, label: English, widget: string, required: false}
              - name: text
                label: الوصف
                widget: object
                collapsed: false
                required: true
                fields:
                  - {name: ar, label: العربية, widget: string, required: true}
                  - {name: en, label: English, widget: string, required: false}
              - name: icon
                label: الأيقونة
                widget: select
                required: false
                options:
                  - {label: شاشة / أنظمة, value: monitor}
                  - {label: درع / أمن, value: shield}
                  - {label: شبكة, value: network}
                  - {label: أدوات, value: tools}
                  - {label: سماعة / دعم, value: headset}
                  - {label: طبقات / تصميم, value: layers}
                  - {label: اتصال WAN, value: wan}
                  - {label: قبعة تخرج, value: graduation}
              - name: stack
                label: التقنيات (تظهر في النسخة الإنجليزية)
                widget: list
                required: false
                summary: "{{fields.ar}}"
                fields:
                  - {name: ar, label: العربية, widget: string}
                  - {name: en, label: English, widget: string, required: false}

      - name: learning
        label: أتعلّمه حالياً
        file: content/learning.json
        description: ""
        fields:
          - name: items
            label: القائمة
            widget: list
            add_to_top: true
            summary: "{{fields.title.ar}}"
            fields:
              - name: title
                label: العنوان
                widget: object
                collapsed: false
                required: true
                fields:
                  - {name: ar, label: العربية, widget: string, required: true}
                  - {name: en, label: English, widget: string, required: false}
              - name: status
                label: الحالة (نص)
                widget: object
                collapsed: false
                required: true
                fields:
                  - {name: ar, label: العربية, widget: string, required: true}
                  - {name: en, label: English, widget: string, required: false}
              - name: text
                label: الوصف
                widget: object
                collapsed: false
                required: true
                fields:
                  - {name: ar, label: العربية, widget: string, required: true}
                  - {name: en, label: English, widget: string, required: false}
              - name: state
                label: لون الحالة
                widget: select
                options:
                  - {label: قيد التنفيذ, value: progress}
                  - {label: مخطط له, value: planned}

      - name: education
        label: التعليم
        file: content/education.json
        description: ""
        fields:
          - name: items
            label: القائمة
            widget: list
            add_to_top: true
            summary: "{{fields.title.ar}}"
            fields:
              - name: title
                label: الشهادة / الدرجة
                widget: object
                collapsed: false
                required: true
                fields:
                  - {name: ar, label: العربية, widget: string, required: true}
                  - {name: en, label: English, widget: string, required: false}
              - name: org
                label: الجهة
                widget: object
                collapsed: false
                required: true
                fields:
                  - {name: ar, label: العربية, widget: string, required: true}
                  - {name: en, label: English, widget: string, required: false}
              - name: place
                label: المكان
                widget: object
                collapsed: false
                required: true
                fields:
                  - {name: ar, label: العربية, widget: string, required: true}
                  - {name: en, label: English, widget: string, required: false}
              - name: date
                label: التاريخ
                widget: object
                collapsed: false
                required: true
                fields:
                  - {name: ar, label: العربية, widget: string, required: true}
                  - {name: en, label: English, widget: string, required: false}
              - name: icon
                label: الأيقونة
                widget: select
                required: false
                options:
                  - {label: شاشة / أنظمة, value: monitor}
                  - {label: درع / أمن, value: shield}
                  - {label: شبكة, value: network}
                  - {label: أدوات, value: tools}
                  - {label: سماعة / دعم, value: headset}
                  - {label: طبقات / تصميم, value: layers}
                  - {label: اتصال WAN, value: wan}
                  - {label: قبعة تخرج, value: graduation}

