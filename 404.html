<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404 — الصفحة غير موجودة | Page not found</title>
<style>
:root{--bg:#050E15;--ink:#E4F1F5;--ink-2:#93B2BF;--signal:#3FD8CE;--line:#143241;color-scheme:dark light}
@media (prefers-color-scheme:light){:root{--bg:#EEF3F5;--ink:#0C222D;--ink-2:#41616F;--signal:#0A726E;--line:#C7D6DC}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;line-height:1.6;text-align:center}
main{max-width:520px}
.code{font:600 4rem/1 ui-monospace,Menlo,Consolas,monospace;color:var(--signal);margin:0 0 12px}
h1{font-size:1.3rem;margin:0 0 8px}
p{color:var(--ink-2);margin:0 0 20px}
.links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
a{display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border:1px solid var(--signal);border-radius:11px;color:var(--signal);font-weight:600;text-decoration:none}
a:hover,a:focus-visible{background:var(--signal);color:var(--bg);outline:none}
</style>
</head>
<body>
<main>
<p class="code" aria-hidden="true">404</p>
<h1>الصفحة غير موجودة</h1>
<p>الرابط الذي فتحته غير صحيح أو لم يعد متوفراً.</p>
<h1 lang="en" dir="ltr">Page not found</h1>
<p lang="en" dir="ltr">The link may be incorrect or the page may have moved.</p>
<div class="links">
<a href="/">الرئيسية</a>
<a href="/en/" lang="en" dir="ltr">Home (English)</a>
</div>
</main>
</body>
</html>
